<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>
    <form name="myform" onclick="validateForm(event)">
        <label>Name: <input type="text" name="fname" placeholder="Enter your Name"></label>
        <input type="submit" value="Submit">
        <p id="message"></p>
    </form>
    <script>

        function validateForm(event){
            event.preventDefault()
            
         let name = document.forms["myform"]["fname"].value;


         if(name === ""){
            alert("Invalid Information");
            return false
         }
         else{
            document.getElementById("message").innerHTML = "Name Submitted: " + name
         }

        }

    </script>
</body>
</html>
